<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#22423a">
<title>Gitabase Reader</title>
<link rel="icon" type="image/svg+xml" href="img/app-icon.svg">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/own-art.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/v2.css">
<link rel="stylesheet" href="css/desk.css">
<link rel="stylesheet" href="css/glass.css">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Tabs"></nav>
  <section id="left"></section>
  <section id="reader"></section>
</div>
<div id="overlays"></div>
<div id="dropzone"><div>Drop .db / .gitabase files to add them to your library</div></div>
<input type="file" id="fileAdd" accept=".db,.gitabase,.sqlite,.sqlite3,.gdb" multiple hidden>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>
<div id="boot"><img src="img/app-icon.svg" alt=""><div class="boot-msg">Loading…</div></div>
<script>window.GB = { APP_NAME: 'Gitabase Reader' };   // app name: change it here, in <title> and in manifest.webmanifest</script>
<script src="js/sqlite-src.js"></script>
<script src="js/db.js"></script>
<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/library.js"></script>
<script src="js/render.js"></script>
<script src="js/notes.js"></script>
<script src="js/ui-home.js"></script>
<script src="js/ui-book.js"></script>
<script src="js/ui-reader.js"></script>
<script src="js/ui-extra.js"></script>
<script src="js/ui-v2.js"></script>
<script src="js/ui-desk.js"></script>
<script src="js/glass.js"></script>
<script src="js/app.js"></script>
</body>
</html>
