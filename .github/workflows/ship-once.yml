# One-time job: the new app (preview branch) becomes the main site. Only the app files are copied
# (index.html, sw.js, manifest, README, css, js, fonts, img); databases, tools and workflows stay as they are on main.
# The old app is kept on branch "old" and published at /old/. This file deletes itself in the same commit.
name: One-time - ship the new app to main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ship-once.yml']
permissions:
  contents: write
  actions: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - name: Copy the preview app over main
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin old > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin preview
          P="css js fonts img index.html sw.js manifest.webmanifest README.md"
          git rm -r -q --ignore-unmatch $P
          git checkout FETCH_HEAD -- $P
          git rm -q .github/workflows/ship-once.yml
          git status --short | head -50
          git commit -q -m "Ship: the new app (preview) is the main site now; the old app stays on branch old, published at /old/"
          git push origin HEAD:main
      - name: Publish
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
