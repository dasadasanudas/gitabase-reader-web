# Rebuilds the site (live site + /preview/) whenever the preview branch changes.
name: Preview - rebuild the site
on:
  push:
    branches: [preview]
    paths-ignore: ['.github/**']
permissions:
  actions: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Publish reader to run on main
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
